<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#111B2E" stroke-width="1"/>
    </pattern>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#0A3A52"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" fill="#0B0F19"/>
  <rect x="40" y="40" width="1520" height="1020" rx="18" fill="#0D1322" stroke="#1F2937" stroke-width="3"/>
  <rect x="50" y="50" width="1500" height="1000" rx="12" fill="url(#grid)"/>

  <!-- Boundary wall -->
  <rect x="60" y="60" width="1480" height="980" rx="10" fill="none" stroke="#27334A" stroke-width="4"/>

  <!-- Roads -->
  <g stroke="#2E3B52" stroke-width="34" stroke-linecap="butt">
    <line x1="60" y1="400" x2="1540" y2="400"/>
    <line x1="540" y1="60" x2="540" y2="1040"/>
    <line x1="1060" y1="60" x2="1060" y2="1040"/>
    <line x1="60" y1="720" x2="1540" y2="720"/>
  </g>
  <g stroke="#1A2436" stroke-width="38">
    <line x1="60" y1="400" x2="1540" y2="400"/>
    <line x1="540" y1="60" x2="540" y2="1040"/>
    <line x1="1060" y1="60" x2="1060" y2="1040"/>
    <line x1="60" y1="720" x2="1540" y2="720"/>
  </g>
  <g stroke="#3E4C66" stroke-width="2" stroke-dasharray="14 16">
    <line x1="60" y1="400" x2="1540" y2="400"/>
    <line x1="540" y1="60" x2="540" y2="1040"/>
    <line x1="1060" y1="60" x2="1060" y2="1040"/>
    <line x1="60" y1="720" x2="1540" y2="720"/>
  </g>

  <!-- Blocks -->
  <g fill="#111827" stroke="#222D44" stroke-width="2.5">
    <rect x="80" y="80" width="440" height="300" rx="8"/>
    <rect x="600" y="80" width="440" height="300" rx="8"/>
    <rect x="1120" y="80" width="400" height="300" rx="8"/>
    <rect x="80" y="440" width="440" height="260" rx="8"/>
    <rect x="600" y="440" width="440" height="260" rx="8"/>
    <rect x="1120" y="440" width="400" height="260" rx="8"/>
    <rect x="80" y="740" width="440" height="280" rx="8"/>
    <rect x="600" y="740" width="440" height="280" rx="8"/>
  </g>

  <!-- Building hints -->
  <g fill="#1A2436" stroke="#28344C" stroke-width="2">
    <rect x="120" y="130" width="80" height="80" rx="4"/>
    <rect x="230" y="130" width="80" height="80" rx="4"/>
    <rect x="340" y="130" width="80" height="80" rx="4"/>
    <rect x="120" y="240" width="120" height="80" rx="4"/>
    <rect x="270" y="240" width="120" height="80" rx="4"/>
    <rect x="640" y="130" width="80" height="80" rx="4"/>
    <rect x="750" y="130" width="80" height="80" rx="4"/>
    <rect x="860" y="130" width="80" height="80" rx="4"/>
    <rect x="640" y="240" width="130" height="80" rx="4"/>
    <rect x="800" y="240" width="130" height="80" rx="4"/>
    <rect x="1160" y="130" width="90" height="90" rx="4"/>
    <rect x="1280" y="130" width="90" height="90" rx="4"/>
    <rect x="1400" y="130" width="70" height="90" rx="4"/>
    <rect x="1160" y="250" width="120" height="80" rx="4"/>
    <rect x="1310" y="250" width="120" height="80" rx="4"/>
    <rect x="120" y="480" width="120" height="80" rx="4"/>
    <rect x="270" y="480" width="120" height="80" rx="4"/>
    <rect x="120" y="590" width="180" height="80" rx="4"/>
    <rect x="640" y="480" width="130" height="90" rx="4"/>
    <rect x="800" y="480" width="130" height="90" rx="4"/>
    <rect x="640" y="600" width="180" height="80" rx="4"/>
  </g>

  <!-- Mosque -->
  <g>
    <rect x="1220" y="470" width="70" height="70" rx="6" fill="#1A2436" stroke="#28344C" stroke-width="2"/>
    <path d="M1255 450 1235 470h40Z" fill="#0E7490"/>
    <rect x="1250" y="470" width="10" height="14" fill="#06B6D4"/>
  </g>

  <!-- Commercial plaza -->
  <g fill="#1A2436" stroke="#28344C" stroke-width="2">
    <rect x="1200" y="560" width="120" height="60" rx="4"/>
    <rect x="1340" y="560" width="120" height="60" rx="4"/>
  </g>

  <!-- School -->
  <g fill="#1A2436" stroke="#28344C" stroke-width="2">
    <rect x="660" y="780" width="100" height="100" rx="4"/>
    <rect x="800" y="780" width="100" height="100" rx="4"/>
    <rect x="940" y="780" width="100" height="100" rx="4"/>
    <rect x="720" y="910" width="200" height="70" rx="4"/>
  </g>

  <!-- Park -->
  <rect x="1120" y="740" width="400" height="280" rx="8" fill="#0D1C14" stroke="#10B981" stroke-width="2.5"/>
  <ellipse cx="1320" cy="880" rx="95" ry="55" fill="url(#lake)" stroke="#0891B2" stroke-width="2.5"/>
  <g fill="#14532D" stroke="#1E6B3A" stroke-width="2">
    <circle cx="1180" cy="800" r="16"/>
    <circle cx="1230" cy="800" r="10"/>
    <circle cx="1380" cy="790" r="12"/>
    <circle cx="1430" cy="830" r="9"/>
    <circle cx="1180" cy="950" r="11"/>
  </g>
  <path d="M1180 900 q12 -14 24 0 t24 0" fill="none" stroke="#1E6B3A" stroke-width="3"/>

  <!-- Block labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700" fill="#2C3A55" text-anchor="middle">
    <text x="300" y="245">SECTOR A</text>
    <text x="820" y="245">SECTOR B</text>
    <text x="1320" y="245">SECTOR C</text>
    <text x="300" y="580">SECTOR D</text>
    <text x="820" y="580">SECTOR E</text>
    <text x="800" y="900">SECTOR H — SCHOOL</text>
    <text x="1320" y="790" fill="#14532D">JAZZ PARK</text>
  </g>

  <!-- Security checkpoint -->
  <g>
    <rect x="585" y="415" width="70" height="50" rx="6" fill="#111827" stroke="#EF4444" stroke-width="3"/>
    <circle cx="620" cy="440" r="6" fill="#EF4444"/>
  </g>

  <!-- Main entrance gate -->
  <g>
    <rect x="740" y="1000" width="120" height="50" rx="6" fill="#111827" stroke="#06B6D4" stroke-width="3"/>
    <rect x="700" y="1030" width="200" height="4" fill="#06B6D4"/>
    <circle cx="760" cy="1025" r="5" fill="#06B6D4"/>
    <circle cx="840" cy="1025" r="5" fill="#06B6D4"/>
  </g>

  <!-- Labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#64748B">
    <text x="600" y="402" fill="#F59E0B" font-size="18">SECURITY CHECKPOINT</text>
    <text x="820" y="1026" fill="#06B6D4">MAIN ENTRANCE</text>
    <text x="690" y="758" fill="#64748B" font-size="18">SECTOR H</text>
    <text x="1200" y="762" fill="#10B981" font-size="18">RECREATION ZONE</text>
  </g>

  <!-- North arrow -->
  <g transform="translate(1510, 118)">
    <circle r="26" fill="#0D1322" stroke="#1F2937" stroke-width="2"/>
    <path d="M0 -16 L8 10 L0 4 L-8 10 Z" fill="#EF4444"/>
    <text x="0" y="-30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#64748B">N</text>
  </g>

  <!-- Title -->
  <text x="80" y="48" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#06B6D4" letter-spacing="2">
    NAVAL ANCHORAGE / PINDI HOUSING SOCIETY — GIS OVERLAY
  </text>

  <!-- Scale bar -->
  <g transform="translate(80, 992)">
    <rect width="180" height="8" fill="#06B6D4"/>
    <rect x="0" y="0" width="60" height="8" fill="#F59E0B"/>
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="16" fill="#64748B">0</text>
    <text x="168" y="24" font-family="'JetBrains Mono', monospace" font-size="16" fill="#64748B">200m</text>
  </g>
</svg>