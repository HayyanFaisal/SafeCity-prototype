<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#E9EAF0"/>
  <!-- Outer boundary -->
  <rect x="8" y="12" width="84" height="74" rx="1.5" fill="none" stroke="#27334A" stroke-width="1.4"/>
  <!-- Roads -->
  <g stroke="#ffffff" stroke-width="1.6">
    <line x1="8" y1="30" x2="92" y2="30"/>
    <line x1="8" y1="50" x2="92" y2="50"/>
    <line x1="8" y1="66" x2="92" y2="66"/>
    <line x1="30" y1="12" x2="30" y2="86"/>
    <line x1="50" y1="12" x2="50" y2="86"/>
    <line x1="70" y1="12" x2="70" y2="86"/>
  </g>
  <g stroke="#8CA0B8" stroke-width="0.25">
    <line x1="8" y1="30" x2="92" y2="30"/>
    <line x1="8" y1="50" x2="92" y2="50"/>
    <line x1="8" y1="66" x2="92" y2="66"/>
    <line x1="30" y1="12" x2="30" y2="86"/>
    <line x1="50" y1="12" x2="50" y2="86"/>
    <line x1="70" y1="12" x2="70" y2="86"/>
  </g>
  <!-- Central circular park + ring road -->
  <circle cx="50" cy="50" r="10" fill="#ffffff" stroke="#8CA0B8" stroke-width="0.8"/>
  <circle cx="50" cy="50" r="6.5" fill="#7CB87A" stroke="#4C8A4A" stroke-width="0.3"/>
  <circle cx="50" cy="50" r="2" fill="#A9D5A5"/>
  <!-- Blocks -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle">
    <!-- Block A -->
    <rect x="10" y="14" width="18" height="14" fill="#D98E63" stroke="#C05631" stroke-width="0.4"/>
    <text x="19" y="24" font-size="3.2" fill="#7A2E12" letter-spacing="0.3">BLOCK A</text>
    <!-- Block B -->
    <rect x="32" y="14" width="16" height="14" fill="#E0A87E" stroke="#C05631" stroke-width="0.4"/>
    <text x="40" y="24" font-size="3.2" fill="#7A2E12" letter-spacing="0.3">BLOCK B</text>
    <!-- Block C -->
    <rect x="52" y="14" width="16" height="14" fill="#C76B34" stroke="#9A4E20" stroke-width="0.4"/>
    <text x="60" y="24" font-size="3.2" fill="#5E2C10" letter-spacing="0.3">BLOCK C</text>
    <!-- Block D -->
    <rect x="72" y="14" width="18" height="14" fill="#C76B34" stroke="#9A4E20" stroke-width="0.4"/>
    <text x="81" y="24" font-size="3.2" fill="#5E2C10" letter-spacing="0.3">BLOCK D</text>
    <!-- Block E -->
    <rect x="10" y="52" width="18" height="12" fill="#7FA8C9" stroke="#4C7BB5" stroke-width="0.4"/>
    <text x="19" y="60" font-size="3.2" fill="#163A5C" letter-spacing="0.3">BLOCK E</text>
    <!-- Block F -->
    <rect x="32" y="52" width="16" height="12" fill="#E0A87E" stroke="#C05631" stroke-width="0.4"/>
    <text x="40" y="60" font-size="3.2" fill="#7A2E12" letter-spacing="0.3">BLOCK F</text>
    <!-- Block G -->
    <rect x="52" y="52" width="16" height="12" fill="#A98BC9" stroke="#7C5FA8" stroke-width="0.4"/>
    <text x="60" y="60" font-size="3.2" fill="#3F2C63" letter-spacing="0.3">BLOCK G</text>
    <!-- Block H (master plan, detached) -->
    <rect x="74" y="70" width="16" height="14" fill="#C76B34" stroke="#9A4E20" stroke-width="0.4"/>
    <text x="82" y="78" font-size="2.6" fill="#5E2C10">MASTER PLAN</text>
    <text x="82" y="82" font-size="3" fill="#5E2C10">(BLOCK-H)</text>
    <!-- Central plaza -->
    <rect x="46.5" y="44" width="7" height="5" fill="#B7BCC9" stroke="#66707F" stroke-width="0.3"/>
    <text x="50" y="47.6" font-size="1.6" fill="#333B4A">PLAZA</text>
  </g>
  <!-- Jahan Road along left + bottom -->
  <g>
    <rect x="3.2" y="8" width="2.4" height="84" fill="#C9CDD6"/>
    <rect x="6" y="88" width="88" height="2.4" fill="#C9CDD6"/>
    <text x="4.4" y="50" font-family="Arial" font-size="1.7" fill="#475569" transform="rotate(-90 4.4 50)" font-weight="bold">JAHAN ROAD</text>
    <text x="50" y="91.4" font-family="Arial" font-size="1.7" fill="#475569" text-anchor="middle" font-weight="bold">JAHAN ROAD</text>
  </g>
  <!-- Gates -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" font-size="1.6" fill="#B91C1C">
    <rect x="40" y="8.6" width="20" height="2.6" fill="#FECACA" stroke="#EF4444" stroke-width="0.3"/>
    <text x="50" y="10.5">GATE-I JINNAH</text>
    <rect x="6.6" y="18" width="12" height="2.6" fill="#FECACA" stroke="#EF4444" stroke-width="0.3"/>
    <text x="12.9" y="19.7">GATE-II</text>
    <rect x="73" y="8.6" width="18" height="2.6" fill="#FECACA" stroke="#EF4444" stroke-width="0.3"/>
    <text x="82" y="10.5">GATE-III IQBAL</text>
    <rect x="10" y="84.6" width="16" height="2.6" fill="#FECACA" stroke="#EF4444" stroke-width="0.3"/>
    <text x="18" y="86.5">GATE-V NISHTAR</text>
    <rect x="46" y="84.6" width="12" height="2.6" fill="#FECACA" stroke="#EF4444" stroke-width="0.3"/>
    <text x="52" y="86.5">GATE-VI</text>
    <rect x="92.2" y="46" width="5" height="14" fill="#FECACA" stroke="#EF4444" stroke-width="0.3"/>
    <text x="94.8" y="50" font-size="1.5" transform="rotate(90 94.8 50)">GATE-IV</text>
  </g>
  <!-- Surrounding localities -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="1.9" fill="#334155">
    <text x="14" y="7" text-anchor="middle">SIHALA</text>
    <text x="38" y="7" text-anchor="middle">HUSSAINABAD</text>
    <text x="64" y="7" text-anchor="middle">BURA BANGYAL</text>
    <text x="96" y="28" text-anchor="middle" transform="rotate(90 96 28)">TALYALA</text>
    <text x="96" y="66" text-anchor="middle" transform="rotate(90 96 66)">SHER DAMIYAL</text>
    <text x="26" y="98" text-anchor="middle">PIRO DAYA</text>
    <text x="60" y="98" text-anchor="middle">GANGOTA SYEDAN</text>
    <text x="86" y="98" text-anchor="middle">GAGRI</text>
  </g>
  <!-- Title -->
  <text x="50" y="4.4" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="3.2" text-anchor="middle" fill="#1E3A8A" letter-spacing="0.6">NAVAL ANCHORAGE ISLAMABAD — MASTER PLAN</text>
  <!-- North arrow -->
  <g transform="translate(94, 94)">
    <circle r="3" fill="#FFFFFF" stroke="#334155" stroke-width="0.3"/>
    <path d="M0 -2 L1 1.2 L0 0.5 L-1 1.2 Z" fill="#DC2626"/>
    <text x="0" y="-3.6" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="1.8" fill="#334155">N</text>
  </g>
</svg>